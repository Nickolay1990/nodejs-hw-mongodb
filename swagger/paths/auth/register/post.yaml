tags:
  - Auth
summary: Register user
operationId: registerUser
description: Register user with payload
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: User's name
            type: string
            example: Jon Doe
          email:
            description: User's email
            type: string
            example: jon.doe@mail.com
          password:
            description: User's password
            type: string
            example: password*******

responses:
  '201':
    $ref: ../../../components/responses/auth/201auth.yaml
  '409':
    $ref: ../../../components/responses/auth/409auth.yaml
  '422':
    $ref: ../../../components/responses/422.yaml
